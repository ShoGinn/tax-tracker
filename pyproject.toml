[project]
authors = [{ name = "Tax Tracker Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
description = "Personal tax calculation and W-4 optimization system"
name = "taxtracker"
readme = "README.md"
requires-python = ">=3.12"
version = "1.0.0"

dependencies = [
    "aiosqlite>=0.19.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
taxtracker = "taxtracker.cli.app:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
disallow_any_unimported = false
disallow_untyped_defs = true
exclude = ["tests/"]
no_implicit_optional = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "sqlalchemy.*"

[tool.pytest.ini_options]
addopts = [
    "--cov-fail-under=90",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=taxtracker",
    "--strict-markers",
    "-v",
]
markers = ["integration: Integration tests", "unit: Unit tests"]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__init__.py", "*/conftest.py", "*/tests/*"]
source = ["src/taxtracker"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["FBT001", "FBT002", "PLR0913", "PLR0915"]
# select = ["E", "F", "I", "UP"]
select = [
    # all possible codes as of this ruff version are listed here,
    # ones we don't want/need are commented out to make it clear
    # which have been omitted on purpose vs which ones get added
    # in new ruff releases and should be considered for enabling
    "ANN", # flake8-annotations
    "C90", # mccabe
    "E",
    "F",   # pyflakes
    "I",   # isort
    "N",   # PEP8 naming
    "UP",  # pyupgrade
    "W",   # pycodestyle
    "YTT", # flake8-2020
    # "S",    # flake8-bandit
    # "BLE",  # flake8-blind-except
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "FBT", # flake8-boolean-trap
    # "COM",  # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    # "DJ",   # flake8-django
    # "EM",   # flake8-errmsg
    # "EXE",  # flake8-executable
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    # "G",    # flake8-logging-format
    # "INP",  # flake8-no-pep420
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    # "PD",   # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    # "TRY",  # tryceratops
    # "NPY",  # NumPy-specific rules
    "FAST", # flake8-fastapi
    "RUF",  # Ruff-specific rules
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = ["types-python-dateutil>=2.9.0.20251115"]
