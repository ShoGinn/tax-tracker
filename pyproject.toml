[project]
authors = [{ name = "Tax Tracker Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
description = "Personal tax calculation and W-4 optimization system"
name = "taxtracker"
readme = "README.md"
requires-python = ">=3.14"
version = "1.0.0"

dependencies = [
    "aiosqlite>=0.19.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
taxtracker = "taxtracker.cli.app:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.7,<0.8"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/**/*.py"]
exclude = ["tests/**"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
output-format = "full"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov-fail-under=80",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=taxtracker",
    "--strict-markers",
    "-v",
]
markers = [
    "integration: Integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: Unit tests",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__init__.py", "*/conftest.py", "*/tests/*"]
source = ["src/taxtracker"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = ["FBT001", "FBT002", "PLR0913", "PLR0915"]
select = [
    # all possible codes as of this ruff version are listed here,
    # ones we don't want/need are commented out to make it clear
    # which have been omitted on purpose vs which ones get added
    # in new ruff releases and should be considered for enabling
    "ANN", # flake8-annotations
    "C90", # mccabe
    "E",
    "F",   # pyflakes
    "I",   # isort
    "N",   # PEP8 naming
    "UP",  # pyupgrade
    "W",   # pycodestyle
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    # "BLE",  # flake8-blind-except
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "FBT", # flake8-boolean-trap
    # "COM",  # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    # "DJ",   # flake8-django
    # "EM",   # flake8-errmsg
    # "EXE",  # flake8-executable
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    # "G",    # flake8-logging-format
    # "INP",  # flake8-no-pep420
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    # "PD",   # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    # "TRY",  # tryceratops
    # "NPY",  # NumPy-specific rules
    "FURB", # refurb
    "LOG",  # flake8-logging
    "PERF", # perflint
    "FAST", # flake8-fastapi
    "RUF",  # Ruff-specific rules
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "E501",
    "ERA001",
    "PLR2004",
    "PT004",
    "S101",
    "SLF001",
]

"__init__.py" = ["F401"]
"scripts/*" = ["T201", "DTZ011", "S310"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11",
    "ty",
    "types-python-dateutil>=2.9.0.20251115",
]
