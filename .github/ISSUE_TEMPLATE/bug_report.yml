name: Bug report
description: Report reproducible incorrect behavior using synthetic data only.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Tax Tracker. Do not include real tax records, credentials, Social Security numbers, addresses, or other personally identifiable information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic inputs and list the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Enter synthetic values ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What result did you expect, and why?
    validations:
      required: true
  - type: input
    id: tax_year
    attributes:
      label: Tax year
      placeholder: "2026"
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.11.1 or a commit SHA
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 143 on macOS 27
  - type: textarea
    id: evidence
    attributes:
      label: Supporting source or diagnostic details
      description: Link authoritative IRS/SSA guidance for calculation issues. Redact screenshots and logs before attaching them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed credentials and personally identifiable information.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
