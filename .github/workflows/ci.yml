name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run ty check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Scan dependencies for known vulnerabilities
        run: uvx uv-secure

  pslmodels-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Fetch fresh PSLmodels snapshot
        run: uv run python scripts/fetch_pslmodels_data.py snapshot --years 2025 --years 2026
      - name: Run cross-validation tests against fresh snapshot
        run: uv run pytest tests/unit/test_pslmodels_cross_check.py -v --no-header --override-ini='addopts='
      - name: Check for snapshot drift
        run: |
          if git diff --quiet tests/data/pslmodels_snapshot.json; then
            echo "Snapshot unchanged — PSLmodels data matches committed snapshot."
          else
            echo "::warning::PSLmodels snapshot has changed. Run locally and commit:"
            echo "  uv run python scripts/fetch_pslmodels_data.py snapshot --years 2025 2026"
            git diff tests/data/pslmodels_snapshot.json
          fi
