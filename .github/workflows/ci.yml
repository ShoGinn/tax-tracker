name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run pytest

  typecheck:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run ty check

  security:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Scan dependencies for known vulnerabilities
        run: uvx uv-secure

  pslmodels-cross-check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Fetch fresh PSLmodels snapshot
        run: uv run python scripts/fetch_pslmodels_data.py snapshot --years 2025 --years 2026
      - name: Run cross-validation tests against fresh snapshot
        run: uv run pytest tests/unit/test_pslmodels_cross_check.py -v --no-header --override-ini='addopts='
      - name: Check for snapshot drift
        run: |
          if git diff --quiet tests/data/pslmodels_snapshot.json; then
            echo "Snapshot unchanged — PSLmodels data matches committed snapshot."
          else
            echo "::warning::PSLmodels snapshot has changed. Run locally and commit:"
            echo "  uv run python scripts/fetch_pslmodels_data.py snapshot --years 2025 2026"
            git diff tests/data/pslmodels_snapshot.json
          fi

  release:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, security, pslmodels-cross-check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Release with python-semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from python-semantic-release semantic-release version --no-changelog --skip-build
