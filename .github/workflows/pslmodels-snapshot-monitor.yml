name: PSL Snapshot Monitor

on:
    schedule:
        - cron: '17 13 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    detect-and-pr:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true

            - name: Preserve committed snapshot baseline
              run: cp tests/data/pslmodels_snapshot.json /tmp/pslmodels_snapshot_baseline.json

            - name: Fetch fresh PSLmodels snapshot
              run: uv run python scripts/fetch_pslmodels_data.py snapshot

            - name: Run cross-validation tests against fresh snapshot
              run: uv run pytest tests/unit/test_pslmodels_cross_check.py -v --no-header --override-ini='addopts='

            - name: Detect value drift excluding generated_date
              id: detect
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  baseline_path = Path("/tmp/pslmodels_snapshot_baseline.json")
                  current_path = Path("tests/data/pslmodels_snapshot.json")

                  baseline = json.loads(baseline_path.read_text())
                  current = json.loads(current_path.read_text())

                  def normalize(payload: dict[str, object]) -> dict[str, object]:
                      normalized = dict(payload)
                      normalized.pop("generated_date", None)
                      return normalized

                  baseline_normalized = normalize(baseline)
                  current_normalized = normalize(current)

                  has_value_drift = baseline_normalized != current_normalized
                  has_date_only_drift = (not has_value_drift) and (
                      baseline.get("generated_date") != current.get("generated_date")
                  )

                  github_output = Path(os.environ["GITHUB_OUTPUT"])
                  github_output.write_text(
                      f"value_drift={'true' if has_value_drift else 'false'}\n"
                      f"date_only_drift={'true' if has_date_only_drift else 'false'}\n",
                      encoding="utf-8",
                  )

                  if has_value_drift:
                      print("Value drift detected between committed and fresh PSL snapshot.")
                  elif has_date_only_drift:
                      print("Date-only drift detected (generated_date changed, values unchanged).")
                  else:
                      print("No snapshot drift detected.")
                  PY

            - name: Summarize drift classification
              run: |
                  if [[ "${{ steps.detect.outputs.value_drift }}" == "true" ]]; then
                    echo "Value drift detected. Preparing automated pull request."
                    git --no-pager diff -- tests/data/pslmodels_snapshot.json
                  elif [[ "${{ steps.detect.outputs.date_only_drift }}" == "true" ]]; then
                    echo "Date-only drift detected. Skipping pull request creation."
                  else
                    echo "No drift detected. Skipping pull request creation."
                  fi

            - name: Create pull request for PSL value drift
              if: steps.detect.outputs.value_drift == 'true'
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
              with:
                  branch: bot/pslmodels-snapshot-update
                  delete-branch: true
                  commit-message: 'chore: update PSLmodels snapshot'
                  title: 'chore: update PSLmodels snapshot'
                  body: |
                      Automated update generated by PSL Snapshot Monitor.

                      Changes included:
                      - Refreshed tests/data/pslmodels_snapshot.json from PSLmodels
                      - Ran PSLmodels cross-validation tests in workflow

                      This PR is opened only when snapshot tax values change.
                      Date-only generated_date changes are ignored.
                  labels: |
                      chore
                      tax-data
                  add-paths: |
                      tests/data/pslmodels_snapshot.json
