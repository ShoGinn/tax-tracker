name: Pre-commit Hook Autoupdate

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.release-token.outputs.token }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Sync development dependencies
        run: uv sync --dev

      - name: Update pre-commit hook revisions
        run: uv run pre-commit autoupdate

      - name: Create pull request for hook updates
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: bot/pre-commit-autoupdate
          delete-branch: true
          commit-message: 'chore: autoupdate pre-commit hooks'
          title: 'chore: autoupdate pre-commit hooks'
          body: |
            Automated weekly update of `.pre-commit-config.yaml` hook revisions.

            Generated by the Pre-commit Hook Autoupdate workflow.
          labels: |
            chore
          add-paths: |
            .pre-commit-config.yaml
          token: ${{ steps.release-token.outputs.token }}
