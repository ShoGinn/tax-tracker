version: 2

updates:
  # Frontend dependencies (pnpm lockfile via npm ecosystem)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      production:
        patterns: ['*']
        exclude-patterns: ['@types/*', 'oxlint', 'oxfmt', 'typescript', 'vite', '@vitejs/*']
      dev:
        patterns: ['@types/*', 'oxlint', 'oxfmt', 'typescript', 'vite', '@vitejs/*']

  # Python dependencies (uv)
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      production:
        patterns: ['*']
        exclude-patterns: ['ruff', 'ty', 'pytest*', 'httpx', 'types-*']
      dev:
        patterns: ['ruff', 'ty', 'pytest*', 'httpx', 'types-*']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
