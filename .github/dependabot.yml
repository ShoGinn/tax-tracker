version: 2

updates:
  # Python dependencies (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production:
        patterns: ["*"]
        exclude-patterns: ["ruff", "ty", "pytest*", "httpx", "types-*"]
      dev:
        patterns: ["ruff", "ty", "pytest*", "httpx", "types-*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
